# Basic TURN server configuration for local development
listening-port=3478
tls-listening-port=5349
listening-ip=127.0.0.1
external-ip=127.0.0.1
realm=localhost
server-name=localhost

# For development, you can use simple authentication
lt-cred-mech
user=test:test123

# Disable security features for easier local testing
no-stun
no-tls
no-dtls
no-cli

# Enable verbose logging for debugging
verbose