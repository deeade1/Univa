name: Full Stack CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
      DJANGO_TEST_DB_NAME: test_root

    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements/base.txt
            apps/backend/requirements/testing.txt

      - name: Install backend deps
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/testing.txt

      - name: Lint
        working-directory: apps/backend
        run: ruff check .

      - name: Check for un-generated migrations
        working-directory: apps/backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: apps/backend
        run: pytest -v

  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Install and build
        working-directory: apps/marketing
        run: |
          npm ci
          npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Univa/package-lock.json

      - name: Install and test
        working-directory: apps/Univa
        run: |
          npm ci
          npm test -- --passWithNoTests